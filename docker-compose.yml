# deploy หมากสี่กระดานบนเครื่องตัวเอง
#
#   docker compose up -d --build
#   เปิด http://localhost:8090
#
# ค่าลับอ่านจากไฟล์ .env ข้าง ๆ ไฟล์นี้ (ดู .env.example)

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # ไม่ publish port ออกนอก — มีแค่ app ที่ต้องใช้
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8090}:3000"
    environment:
      # ทุก node ต้องใช้ค่าเดียวกัน ไม่งั้นตัวตนข้ามเครื่องไม่ได้
      AUTH_SECRET: ${AUTH_SECRET:?ต้องตั้ง AUTH_SECRET ใน .env ก่อน}
      DATABASE_URL: file:/app/data/game.db
      REDIS_URL: redis://redis:6379
      # URL ที่เบราว์เซอร์เห็นจริง ใช้ทั้งลิงก์เชิญและการ redirect ข้าม node
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8090}
      NODE_URL: ${PUBLIC_URL:-http://localhost:8090}
      NODE_ID: ${NODE_ID:-node-local}
      TURN_SECONDS: ${TURN_SECONDS:-45}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      # ไม่ตั้งสองตัวนี้ = OTP พิมพ์ลง log ของ container และปิดล็อกอิน Google
      MAIL_WEBHOOK_URL: ${MAIL_WEBHOOK_URL:-}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:-}
    volumes:
      - game-data:/app/data
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
  game-data:

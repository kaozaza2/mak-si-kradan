# ระบบสำหรับ deploy จริง — กระจายหลายเครื่อง
#
# หนึ่งห้องหนึ่งแมตช์มีเจ้าของโหนดเดียว สถานะเกมอยู่ในหน่วยความจำของโหนดนั้น
# โหนดอื่นเป็นทางผ่านผ่าน Redis pub/sub ดังนั้นหนึ่งโหนดตาย เกมที่อยู่ที่โหนดนั้น
# จะหายไป แต่ห้องที่ยังไม่เริ่มเล่นจะถูกประกาศใหม่ให้โหนดอื่นรับช่วงต่อได้
#
# เริ่ม:
#   cp .env.example .env       แล้วแก้ค่าที่จำเป็น
#   docker compose up -d
#
# ต้องมีอย่างน้อย: AUTH_SECRET (32 ตัวขึ้นไป), CORS_ORIGINS, PUBLIC_URL ที่เป็น https
# และช่องทางส่งอีเมล ถ้าขาด แอปจะไม่ยอมเริ่มและจะบอกรายการที่ขาดทั้งหมด

name: mak-thai

x-api-env: &api-env
  ENVIRONMENT: production
  AUTO_CREATE_TABLES: "false"
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-makthai}:${POSTGRES_PASSWORD:?ต้องตั้ง POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-makthai}
  REDIS_URL: redis://redis:6379/0
  CLUSTER_PREFIX: ${CLUSTER_PREFIX:-makthai}
  AUTH_SECRET: ${AUTH_SECRET:?ต้องตั้ง AUTH_SECRET อย่างน้อย 32 ตัวอักษร}
  PUBLIC_URL: ${PUBLIC_URL:?ต้องตั้ง PUBLIC_URL ให้เป็น https}
  CORS_ORIGINS: ${CORS_ORIGINS:?ต้องระบุ origin ที่อนุญาตจริง ห้ามใช้ *}
  SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
  TURN_SECONDS: ${TURN_SECONDS:-45}
  MAX_CONNECTIONS_PER_PEER: ${MAX_CONNECTIONS_PER_PEER:-8}
  MAX_CONNECTIONS_TOTAL: ${MAX_CONNECTIONS_TOTAL:-10000}
  MAIL_FROM: ${MAIL_FROM:-"หมากไทย <no-reply@mak-thai.example>"}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_START_TLS: ${SMTP_START_TLS:-true}
  GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
  GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:-}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-makthai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ต้องตั้ง POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-makthai}
      # ให้ฐานข้อมูลตรวจสอบความถูกต้องตอนเขียน
      # ช้าลงเล็กน้อยแต่ไม่มีข้อมูลเสียเงียบ ๆ ซึ่งอันดับกับข้อมูลอันดับไม่ได้
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-makthai} -d ${POSTGRES_DB:-makthai}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # ไม่เปิดพอร์ตออกนอก เพราะไม่มีใครต้องต่อจากภายนอก
    # ถ้าอยากต่อเพื่อดูข้อมูล ให้ใช้ docker compose exec postgres psql แทน
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    expose:
      - "6379"

  # แก้ตารางก่อนให้แอปเริ่ม
  # ต้องรันจบก่อนแอปจะรับงาน เพราะ create_all ไม่แก้ตารางที่มีอยู่แล้ว
  # แอปที่ยังไม่มีตารางจะค้างเงียบจนมีคนมาสมัครแล้วล้ม
  migrate:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: release
    restart: "no"
    environment: *api-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api1: &api
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: release
    restart: unless-stopped
    environment:
      <<: *api-env
      # ต้องระบุเอง ไม่งั้นทุกโหนดชื่อเดียวกันแล้วผลลัพธ์จะทับกัน
      NODE_ID: ${NODE_ID_1:-api1}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # โหนดต้องเห็น IP จริงของผู้เล่น ไม่ใช่ IP ของ proxy
    # ไม่งั้นการจำกัดการเชื่อมต่อต่อ IP จะนับทุกคนเป็นคนเดียว
    # แล้วคนเดียวเปิดหลายแท็บจะเตะคนอื่นออก
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=4).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          # ตั้งเพดานไว้ให้สังเกตง่าย ถ้าชนต้องเพิ่มหรือหาทางลดการใช้
          # แอปไม่ตัดการเชื่อมต่อเองเมื่อชนเพดานนี้ เพราะการโดน OOM แย่กว่าการช้า
          memory: 2G

  # โหนดที่สอง — เพิ่มโดยก๊อปบล็อก api1 แล้วเปลี่ยนชื่อกับ NODE_ID
  # ถ้าจะเพิ่มจำนวนเครื่อง คัดลอกทั้งบล็อกนี้
  api2:
    <<: *api
    environment:
      <<: *api-env
      NODE_ID: ${NODE_ID_2:-api2}
    deploy:
      resources:
        limits:
          memory: 2G

  # คิวเว็บและตัวเชื่อมต่อ
  # ทำหน้าที่เดียวคือแจกสายเข้าหาโหนดหลังบ้าน ไม่ต้องมีสถานะเกมใด ๆ
  # ทำให้เพิ่มโหนดได้โดยไม่ต้องย้ายข้อมูลที่ไหน
  web_api:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      # คีย์ที่ใช้คัดลอกคิวไปยังโหนดหลังบ้าน
      # ไม่มีคีย์นี้แล้วการต่อใหม่จะไปยังโหนดเดิมเสมอจนกว่าจะหมดอายุ
      - ./deploy/nginx-upstream.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/ready"]
      interval: 15s
      timeout: 4s
      retries: 3

  web:
    build:
      # ต้องเป็นรากของ workspace เพราะ pnpm-lock.yaml อยู่ที่ราก
      # ถ้าใช้ context ./apps/web จะหา lock ไม่เจอและ --frozen-lockfile จะล้ม
      context: .
      dockerfile: apps/web/Dockerfile
      target: release
    restart: unless-stopped
    depends_on:
      web_api:
        condition: service_healthy
    ports:
      # ผูกกับ 127.0.0.1 เท่านั้น เพราะปล่อยออกมาโดยไม่มี TLS คือเสี่ยง
      # วาง reverse proxy ที่มีใบรับรองไว้ข้างหน้า หรือใช้ proxy ที่มีอยู่แล้ว
      - "${WEB_BIND:-127.0.0.1}:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 4s
      retries: 3

volumes:
  postgres-data:

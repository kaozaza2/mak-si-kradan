upstream api {
    # ชี้ไปยัง load balancer ของ compose ที่คัดการคิวเว็บ
    server web_api:8000;
    keepalive 32;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # หน้าเว็บเป็นแอปแผนที่ทางเดียว ทุก URL ต้องตอบด้วย index.html
    # ไม่งั้นการเปิดลิงก์เชิญหรือรีเฟรชแล้วได้ 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebSocket ต้องมี timeout ยาวกว่าปกติมาก
    # ค่าเริ่มต้น 60 วินาทีจะตัดการเชื่อมต่อของผู้เล่นที่นั่งคิดนาน ๆ
    location /ws {
        proxy_pass http://api;
        proxy_http_version 1.1;

        # บังคับอัปเกรด ไม่งั้น nginx ไม่ยอมเดินต่อไปยัง WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # ต้องมี IP จริง ไม่งั้นการจำกัดการเชื่อมต่อต่อ IP จะนับทุกคนเป็นคนเดียว
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # เกมหนึ่งนัดอาจนานกว่าชั่วโมง แต่ต้องไม่ใช่ตลอดไป
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ส่งต่อให้ทั้งสองทางของการตรวจสถานะ
    # โหนดจะถูกหยุดรับงานใหม่ถ้าฐานข้อมูลหรือ Redis ใช้ไม่ได้
    location = /health {
        proxy_pass http://api/health;
        access_log off;
    }

    location = /ready {
        proxy_pass http://api/ready;
        access_log off;
    }

    # ของที่ไม่ควรถูกแคช เพราะเป็นข้อมูลรายคนหรือเปลี่ยนตลอด
    location ~ ^/api/v1/(me|friends|leaderboard) {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    # ไฟล์ที่มีชื่อกับ hash อยู่ในชื่อ จึงแคชได้นานและไม่ต้องตรวจว่าใหม่หรือไม่
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html ห้ามแคช ไม่งั้นผู้ใช้จะได้ไฟล์เก่าที่ชี้ไปหาไฟล์ที่ไม่มีแล้ว
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # บอกเบราว์เซอร์ให้แคบเฉพาะที่มา
    # 'unsafe-inline' ในสคริปต์เพราะ Vite ใส่ style ในไฟล์ ถ้าเปลี่ยมาเป็นไฟล์แยกค่อยตัดออก
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss: https://accounts.google.com; frame-src https://accounts.google.com; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

[project]
name = "mak-thai-api"
version = "0.1.0"
description = "แพลตฟอร์มเกมกระดานออนไลน์ — backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    "pydantic>=2.11",
    "pydantic-settings>=2.11",
    "sqlalchemy[asyncio]>=2.0.44",
    "alembic>=1.16",
    "asyncpg>=0.30",
    "aiosqlite>=0.21",
    "argon2-cffi>=25.1",
    "redis>=6.4",
    "httpx>=0.28",
    "cryptography>=50.0.1",
    "aiosmtplib>=5.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "pytest-cov>=7.0",
    "ruff>=0.14",
    "mypy>=1.18",
    "types-redis>=4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/makthai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
# ที่ต้องใช้ฐานข้อมูลหรือ Redis จริง — ข้ามเงียบ ๆ ถ้าไม่มี
# ต้องการให้เห็นว่าข้ามเพราะไม่มีบริการ ไม่ใช่ข้ามเพราะเทสต์พังเงียบ
markers = [
    "integration: ต้องต่อฐานข้อมูลหรือ Redis จริง",
]
filterwarnings = ["error::DeprecationWarning:makthai.*"]

[tool.coverage.run]
source = ["makthai"]
# ไฟล์ที่มีแต่จุดเริ่มแอปและตัวแปลง ทดสอบผ่านการเรียกจริงแทนได้แล้ว
omit = ["*/__init__.py", "*/migrations/*"]

[tool.coverage.report]
# บรรทัดที่ไม่มีเทสต์มากเกินนี้ต้องมีเหตุผลที่เขียนไว้ ไม่ใช่ปล่อยผ่านเงียบ ๆ
fail_under = 0
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# เอกสารและข้อความในโปรเจกต์เป็นภาษาไทย จึงมีอักขระที่ ruff คิดว่ากำกวมเป็นปกติ
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]

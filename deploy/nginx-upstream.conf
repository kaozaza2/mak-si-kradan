# คิวเว็บของระบบที่กระจายหลายเครื่อง
#
# หน้าที่ของไฟล์นี้มีแค่แจกการเชื่อมต่อเข้าหาโหนดหลังบ้าน ไม่ต้องรู้เรื่องเกมเลย
# สถานะเกมอยู่ที่โหนดเจ้าของห้อง โหนดนี้แค่เป็นทางผ่าน
#
# การเพิ่มโหนดทำโดยเพิ่มบรรทัดใน upstream แล้ว reload ได้เลย
# ไม่ต้องย้ายข้อมูล เพราะแอปไม่เก็บสถานะเกมที่นี่

upstream backend {
    server api1:8000 max_fails=3 fail_timeout=10s;
    server api2:8000 max_fails=3 fail_timeout=10s;

    # ต่อเดิมไว้สักหน่อย ลดการเปิด TCP ใหม่ทุกคำขอ
    # จำนวนไม่มากเพราะต้องพอดีกับจำนวนสายที่แต่ละโหนดรับได้
    keepalive 64;
}

server {
    listen 8000;
    server_name _;

    # โหนดที่ยังไม่ผ่านการตรวจสถานะยังไม่ควรรับคำขอ
    # เพราะ /ready จะคืน 503 เมื่อฐานข้อมูลหรือ Redis ใช้ไม่ได้
    # ถ้าส่งให้รับอยู่ ผู้ใช้จะได้หน้าที่พัง ๆ แทนที่จะถูกส่งไปโหนดที่พร้อม
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 10s;

    location /ws {
        proxy_pass http://backend;
        proxy_http_version 1.1;

        # จุดนี้คือทั้งหมดที่ต้องทำเพื่อให้ WebSocket ทำงานผ่าน nginx
        # ถ้าตัดสองบรรทัดนี้ทิ้ง nginx จะไม่ยอมอัปเกรดคำขอ
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # เกมหนึ่งนัดอาจนานมาก แต่ไม่ถึงขนาดที่ปล่อยไว้ตลอดกาล
        # ค่านี้ต้องมากกว่าเวลาเทิร์นที่ตั้งไว้เสมอ มิฉะนั้นผู้เล่นที่คิดนาน ๆ จะหลุด
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # ต้องปิดการสะสม buffer ไม่งั้นข้อความจะค้างรอเต็มก้อนก่อนส่ง
        # ทำให้การเดินหมากดูเหมือนหน่วง
        proxy_buffering off;
    }

    location / {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
